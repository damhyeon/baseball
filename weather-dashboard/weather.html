<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>우천 취소 지킴이 - 날씨</title>

    <link rel="stylesheet" href="style.css?v=20261023-1" />
    <link rel="stylesheet" href="weather.css?v=20261023-1" />
  </head>

  <body class="weather-body">
    <aside class="app-sidebar">
      <a class="brand" href="index.html"
        ><i class="brand-mark"></i><span>우천 취소 지킴이</span></a
      >
      <nav>
        <a class="nav-home" href="index.html"
          ><i class="nav-icon stadium-icon"></i><span>구장 선택</span></a
        ><a class="nav-weather" href="weather.html"
          ><i class="nav-icon weather-icon-small"></i><span>날씨</span></a
        ><a class="nav-history" href="history.html"
          ><i class="nav-icon history-icon"></i><span>과거 날씨 기록</span></a
        >
      </nav>
      <p class="sidebar-note">야구장 날씨를<br />한눈에 확인하세요.</p>
    </aside>
    <main class="weather-page">
      <section class="weather-card">
        <div class="weather-main">
          <div class="temperature">
            <strong class="hero-location">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                <circle cx="12" cy="10" r="2.5" />
              </svg>
              <span id="heroCity">서울</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5" />
              </svg>
            </strong>
            <div class="hero-temperature-line">
              <span class="temperature-label">현재 기온</span>
              <strong id="temperature">--°</strong>
              <span
                class="hero-weather-icon"
                id="heroWeatherIcon"
                role="img"
                aria-label="비"
              ></span>
            </div>
            <span id="weatherDescription"> 날씨 정보를 불러오는 중... </span>
          </div>
        </div>
      </section>

      <section class="hourly-section">
        <div class="section-title">
          <h2>시간별 날씨</h2>
        </div>

        <div class="hourly-weather" aria-live="polite"></div>
      </section>

      <div class="weather-details" aria-label="현재 날씨 상세">
        <div class="weather-detail">
          <svg
            class="weather-detail-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8 14.5V5a4 4 0 0 1 8 0v9.5a6 6 0 1 1-8 0Z" />
            <path d="M12 6v11" />
          </svg>
          <span>체감온도</span>
          <strong id="feelsLike">--%</strong>
          <small>선선해요</small>
        </div>

        <div class="weather-detail">
          <svg
            class="weather-detail-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M12 2.8c-2.4 3.4-4.2 5.6-4.2 8a4.2 4.2 0 0 0 8.4 0c0-2.4-1.8-4.6-4.2-8Z"
            />
            <path d="M8.5 17.5a4 4 0 0 0 7 1.2" />
          </svg>
          <span>습도</span>
          <strong id="humidityCard">--%</strong>
          <small>약간 높아요</small>
        </div>

        <div class="weather-detail">
          <svg
            class="weather-detail-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 8h11a3 3 0 1 0-2.8-4" />
            <path d="M2 12h16a3 3 0 1 1-2.8 4" />
            <path d="M4 16h5" />
          </svg>
          <span>바람</span>
          <strong id="windCard">-- m/s</strong>
          <small>북동 67°</small>
        </div>
      </div>

      <section class="weather-extra-grid" aria-label="추가 날씨 정보">
        <article class="weather-extra-card rain-probability-card">
          <svg
            class="weather-extra-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 0 1 18 0H3Z" />
            <path d="M12 12v6a2 2 0 0 1-4 0" />
            <path d="M6 8 4.5 6.5M12 5V3m6 5 1.5-1.5" />
          </svg>
          <div class="weather-extra-copy">
            <span>강수확률</span>
            <strong id="rainProbabilityValue">--%</strong>
            <small id="rainProbabilityMessage" aria-live="polite"
              >강수 예보를 불러오는 중입니다.</small
            >
            <div
              class="rain-probability-meter"
              role="progressbar"
              aria-label="강수확률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <span id="rainProbabilityMeter"></span>
            </div>
          </div>
        </article>

        <article class="weather-extra-card uv-index-card">
          <svg
            class="weather-extra-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            />
          </svg>
          <div class="weather-extra-copy">
            <span>자외선 지수</span>
            <strong id="uvIndexValue">--</strong>
            <small id="uvIndexMessage" aria-live="polite"
              >자외선 정보를 불러오는 중입니다.</small
            >
          </div>
        </article>

        <section class="weather-map-card" aria-label="날씨 지도">
          <div class="weather-map-heading">
            <h2>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                <circle cx="12" cy="10" r="2.5" />
              </svg>
              날씨 지도
            </h2>
            <a href="index.html" aria-label="전국 날씨 지도 보기"
              >지도 보기 <span aria-hidden="true">›</span></a
            >
          </div>
          <img
            src="assets/korea-map.svg?v=20260911"
            alt=""
            aria-hidden="true"
          />
          <div class="weather-map-location" aria-label="선택 지역">
            <span aria-hidden="true"></span>
            <strong id="mapCity">서울</strong>
          </div>
        </section>
      </section>
    </main>

    <aside class="weather-stadium-panel" aria-label="전국 구장 날씨">
      <div class="weather-panel-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" />
          <path d="m16 16 4.5 4.5" />
        </svg>
        <input
          id="stadiumSearch"
          type="search"
          placeholder="도시를 검색해보세요"
          aria-label="도시 또는 야구장 검색"
        />
        <span class="weather-panel-current-city">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
          <strong id="panelCity">서울</strong>
          <span aria-hidden="true">⌄</span>
        </span>
      </div>
      <h2>전국 주요 날씨</h2>
      <div class="weather-panel-list">
        <button type="button" data-stadium="인천 SSG랜더스필드">
          <span class="stadium-weather-icon" aria-hidden="true">☁️</span>
          <span class="stadium-weather-name"
            >인천 SSG랜더스필드<small>흐림</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
        <button type="button" data-stadium="잠실야구장">
          <span class="stadium-weather-icon" aria-hidden="true">🌧️</span>
          <span class="stadium-weather-name">잠실야구장<small>비</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
        <button type="button" data-stadium="수원KT위즈파크">
          <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
          <span class="stadium-weather-name"
            >수원 KT 위즈파크<small>구름 조금</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
        <button type="button" data-stadium="대전 한화생명 볼파크">
          <span class="stadium-weather-icon" aria-hidden="true">🌧️</span>
          <span class="stadium-weather-name"
            >대전 한화생명 볼파크<small>비</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
        <button type="button" data-stadium="대구 삼성 라이온즈 파크">
          <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
          <span class="stadium-weather-name"
            >대구 삼성 라이온즈 파크<small>구름 조금</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
        <button type="button" data-stadium="광주기아챔피언스필드">
          <span class="stadium-weather-icon" aria-hidden="true">☀️</span>
          <span class="stadium-weather-name"
            >광주-기아 챔피언스 필드<small>맑음</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
        <button type="button" data-stadium="창원NC파크">
          <span class="stadium-weather-icon" aria-hidden="true">☁️</span>
          <span class="stadium-weather-name"
            >창원 NC파크<small>흐림</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
        <button type="button" data-stadium="사직야구장">
          <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
          <span class="stadium-weather-name"
            >부산 사직야구장<small>구름 조금</small></span
          ><b>21°</b><i aria-hidden="true">›</i>
        </button>
      </div>
      <p class="weather-panel-empty" hidden>검색 결과가 없습니다.</p>
    </aside>

    <script src="weather-list-shuffle.js"></script>
    <script>
      const stadiumName =
        localStorage.getItem("selectedStadium") || "잠실야구장";
      const stadiums = {
        "인천 SSG랜더스필드": { lat: 37.4371, lon: 126.6933 },
        잠실야구장: { lat: 37.5122, lon: 127.0719 },
        수원KT위즈파크: { lat: 37.2997, lon: 127.0098 },
        "대전 한화생명 볼파크": { lat: 36.317, lon: 127.428 },
        "대구 삼성 라이온즈 파크": { lat: 35.841, lon: 128.681 },
        광주기아챔피언스필드: { lat: 35.1681, lon: 126.8891 },
        창원NC파크: { lat: 35.2228, lon: 128.5822 },
        사직야구장: { lat: 35.1941, lon: 129.0615 },
      };
      const cityNames = {
        "인천 SSG랜더스필드": "인천",
        잠실야구장: "서울",
        수원KT위즈파크: "수원",
        "대전 한화생명 볼파크": "대전",
        "대구 삼성 라이온즈 파크": "대구",
        광주기아챔피언스필드: "광주",
        창원NC파크: "창원",
        사직야구장: "부산",
      };
      const icons = {
        Clear: "☀️",
        Clouds: "☁️",
        Rain: "🌧️",
        Drizzle: "🌦️",
        Thunderstorm: "⛈️",
        Snow: "❄️",
        Mist: "🌫️",
      };
      const uvDescriptions = [
        { max: 2, label: "낮음" },
        { max: 5, label: "보통" },
        { max: 7, label: "높음" },
        { max: 10, label: "매우 높음" },
        { max: Infinity, label: "위험" },
      ];
      const place = stadiums[stadiumName] || stadiums["잠실야구장"];
      const apiKey =
        window.OPENWEATHER_API_KEY ||
        localStorage.getItem("openWeatherApiKey") ||
        "";
      const getElement = (id) => document.getElementById(id);

      const cityName = cityNames[stadiumName] || "서울";
      getElement("heroCity").textContent = cityName;
      getElement("mapCity").textContent = cityName;
      getElement("panelCity").textContent = cityName;

      const stadiumSearch = getElement("stadiumSearch");
      const stadiumButtons = [
        ...document.querySelectorAll(".weather-panel-list button"),
      ];
      stadiumSearch.addEventListener("input", () => {
        const query = stadiumSearch.value.trim().toLocaleLowerCase("ko");
        let visibleCount = 0;

        stadiumButtons.forEach((button) => {
          const isMatch = button.textContent
            .toLocaleLowerCase("ko")
            .includes(query);
          button.hidden = !isMatch;
          if (isMatch) visibleCount += 1;
        });
        document.querySelector(".weather-panel-empty").hidden =
          visibleCount > 0;
      });

      stadiumButtons.forEach((button) => {
        button.addEventListener("click", () => {
          localStorage.setItem("selectedStadium", button.dataset.stadium);
          window.location.reload();
        });
      });

      function renderRainProbability(probability) {
        const value = Math.max(0, Math.min(100, probability));
        const card = document.querySelector(".rain-probability-card");
        const message =
          value >= 60
            ? "비가 올 가능성이 높아요."
            : value >= 30
              ? "비가 올 수 있어요. 우산을 준비하세요."
              : "비가 올 가능성이 낮아요.";

        getElement("rainProbabilityValue").textContent = `${value}%`;
        getElement("rainProbabilityMessage").textContent = message;
        document
          .querySelector(".rain-probability-meter")
          .setAttribute("aria-valuenow", String(value));
        getElement("rainProbabilityMeter").style.width = `${value}%`;
        card.dataset.level =
          value >= 60 ? "high" : value >= 30 ? "medium" : "low";
      }

      function renderHourlyForecast(items) {
        const forecast = document.querySelector(".hourly-weather");
        const fragment = document.createDocumentFragment();

        items.slice(0, 12).forEach((item) => {
          const hour = document.createElement("div");
          hour.className = "hour-item";

          const time = document.createElement("span");
          time.className = "time";
          time.textContent = new Date(item.dt * 1000).toLocaleTimeString(
            "ko-KR",
            { hour: "2-digit", minute: "2-digit" },
          );

          const icon = document.createElement("span");
          icon.className = "icon";
          icon.textContent = icons[item.weather[0].main] || "☁️";
          icon.setAttribute("aria-hidden", "true");

          const temperature = document.createElement("strong");
          temperature.textContent = `${Math.round(item.main.temp)}°C`;

          const rain = document.createElement("span");
          rain.className = "rain";
          rain.textContent = `강수 ${Math.round((item.pop || 0) * 100)}%`;

          hour.append(time, icon, temperature, rain);
          fragment.append(hour);
        });

        forecast.replaceChildren(fragment);
      }

      function showForecastMessage(message) {
        const forecast = document.querySelector(".hourly-weather");
        const messageElement = document.createElement("p");
        messageElement.className = "forecast-message";
        messageElement.textContent = message;
        forecast.replaceChildren(messageElement);
      }

      function renderWeather(data) {
        const current = data.list?.[0];
        if (!current) throw new Error("날씨 예보 데이터가 비어 있습니다.");

        getElement("temperature").textContent =
          `${Math.round(current.main.temp)}°`;
        getElement("heroWeatherIcon").textContent =
          icons[current.weather[0].main] || "☁️";
        getElement("heroWeatherIcon").setAttribute(
          "aria-label",
          current.weather[0].description || "날씨",
        );
        getElement("weatherDescription").textContent =
          current.weather[0].description;
        getElement("feelsLike").textContent =
          `${Math.round(current.main.feels_like)}°`;
        getElement("humidityCard").textContent = `${current.main.humidity}%`;
        getElement("windCard").textContent =
          `${Math.round((current.wind?.speed || 0) * 10) / 10} m/s`;

        const rainProbability = Math.round((current.pop || 0) * 100);
        renderRainProbability(rainProbability);
        renderHourlyForecast(data.list);
      }

      async function loadUvIndex() {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.search = new URLSearchParams({
          latitude: String(place.lat),
          longitude: String(place.lon),
          current: "uv_index",
          timezone: "Asia/Seoul",
          forecast_days: "1",
        }).toString();

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const uvIndex = data.current?.uv_index;
          if (typeof uvIndex !== "number" || !Number.isFinite(uvIndex)) {
            throw new Error("자외선 지수 데이터가 없습니다.");
          }

          const roundedIndex = Math.round(uvIndex);
          const category = uvDescriptions.find(
            ({ max }) => uvIndex <= max,
          ).label;
          getElement("uvIndexValue").textContent = String(roundedIndex);
          getElement("uvIndexMessage").textContent = category;
          document.querySelector(".uv-index-card").dataset.level =
            uvIndex <= 2 ? "low" : uvIndex <= 5 ? "medium" : "high";
        } catch (error) {
          console.error("자외선 지수를 불러오지 못했습니다.", error);
          getElement("uvIndexMessage").textContent =
            "자외선 정보를 불러오지 못했습니다.";
        }
      }

      async function loadWeather() {
        if (!apiKey) {
          getElement("weatherDescription").textContent =
            "API 키를 설정하면 실시간 날씨를 볼 수 있습니다.";
          getElement("rainProbabilityMessage").textContent =
            "날씨 API 키를 설정하면 확인할 수 있습니다.";
          showForecastMessage(
            "API 키를 설정하면 시간별 예보를 볼 수 있습니다.",
          );
          return;
        }

        try {
          const url = new URL(
            "https://api.openweathermap.org/data/2.5/forecast",
          );
          url.search = new URLSearchParams({
            lat: String(place.lat),
            lon: String(place.lon),
            appid: apiKey,
            units: "metric",
            lang: "kr",
          }).toString();
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          renderWeather(await response.json());
        } catch (error) {
          console.error("날씨 정보를 불러오지 못했습니다.", error);
          getElement("weatherDescription").textContent =
            "날씨 정보를 불러오지 못했습니다.";
          getElement("rainProbabilityMessage").textContent =
            "강수확률을 불러오지 못했습니다.";
          showForecastMessage("시간별 날씨 정보를 불러오지 못했습니다.");
        }
      }

      loadWeather();
      loadUvIndex();
    </script>
  </body>
</html>
