<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>우천 취소 지킴이 - 날씨</title>

    <link rel="stylesheet" href="style.css?v=20261023-1" />
    <link rel="stylesheet" href="weather.css?v=20261023-1" />
    <link rel="stylesheet" href="weather-scene.css" />
    <script src="weather-scene-boot.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>

  <body class="weather-body">
    <aside class="app-sidebar">
      <a class="brand" href="index.html"
        ><i class="brand-mark"></i><span>우천 취소 지킴이</span></a
      >
      <nav>
        <a class="nav-home" href="index.html"
          ><i class="nav-icon stadium-icon"></i><span>구장 선택</span></a
        ><a class="nav-weather" href="weather.html"
          ><i class="nav-icon weather-icon-small"></i><span>날씨</span></a
        ><a class="nav-history" href="history.html"
          ><i class="nav-icon history-icon"></i><span>날씨 기록</span></a
        >
      </nav>
      <p class="sidebar-note">야구장 날씨를<br />한눈에 확인하세요.</p>
    </aside>
    <main class="weather-page">
      <section class="weather-card">
        <div class="weather-main">
          <div class="temperature">
            <strong class="hero-location">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                <circle cx="12" cy="10" r="2.5" />
              </svg>
              <span id="heroCity">서울</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5" />
              </svg>
            </strong>
            <span id="heroDate" class="hero-date date-text" aria-live="polite"></span>
            <div class="hero-temperature-line">
              <span class="temperature-label"></span>
              <strong id="temperature">--°</strong>
              <span
                class="hero-weather-icon"
                id="heroWeatherIcon"
                role="img"
                aria-label="비"
              ></span>
            </div>
            <span id="weatherDescription"> 날씨 정보를 불러오는 중... </span>
            <span id="heroRainProbability" class="hero-rain-probability" aria-live="polite">
              <span>우천취소 확률</span>
              <strong id="heroRainProbabilityValue">--%</strong>
            </span>
          </div>
        </div>
      </section>

      <section class="hourly-section">
        <div class="section-title">
          <h2 id="hourlyTitle">시간별 날씨</h2>
        </div>

        <div class="hourly-weather" aria-live="polite"></div>
      </section>

      <div class="weather-details" aria-label="현재 날씨 상세">
        <div class="weather-detail">
          <svg
            class="weather-detail-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8 14.5V5a4 4 0 0 1 8 0v9.5a6 6 0 1 1-8 0Z" />
            <path d="M12 6v11" />
          </svg>
          <span>체감온도</span>
          <strong id="feelsLike">--%</strong>
          <small>선선해요</small>
        </div>

        <div class="weather-detail">
          <svg
            class="weather-detail-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M12 2.8c-2.4 3.4-4.2 5.6-4.2 8a4.2 4.2 0 0 0 8.4 0c0-2.4-1.8-4.6-4.2-8Z"
            />
            <path d="M8.5 17.5a4 4 0 0 0 7 1.2" />
          </svg>
          <span>습도</span>
          <strong id="humidityCard">--%</strong>
          <small>약간 높아요</small>
        </div>

        <div class="weather-detail">
          <svg
            class="weather-detail-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 8h11a3 3 0 1 0-2.8-4" />
            <path d="M2 12h16a3 3 0 1 1-2.8 4" />
            <path d="M4 16h5" />
          </svg>
          <span>바람</span>
          <strong id="windCard">-- m/s</strong>
          <small>북동 67°</small>
        </div>
      </div>

      <section class="weather-extra-grid" aria-label="추가 날씨 정보">
        <article class="weather-extra-card rain-probability-card">
          <svg
            class="weather-extra-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 0 1 18 0H3Z" />
            <path d="M12 12v6a2 2 0 0 1-4 0" />
            <path d="M6 8 4.5 6.5M12 5V3m6 5 1.5-1.5" />
          </svg>
          <div class="weather-extra-copy">
            <span>우천취소 확률</span>
            <strong id="rainProbabilityValue">--%</strong>
            <small id="rainProbabilityMessage" aria-live="polite"
              >강수 예보를 불러오는 중입니다.</small
            >
            <div
              class="rain-probability-meter"
              role="progressbar"
              aria-label="우천취소 확률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <span id="rainProbabilityMeter"></span>
            </div>
          </div>
        </article>

        <article class="weather-extra-card uv-index-card">
          <svg
            class="weather-extra-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            />
          </svg>
          <div class="weather-extra-copy">
            <span>자외선 지수</span>
            <strong id="uvIndexValue">--</strong>
            <small id="uvIndexMessage" aria-live="polite"
              >자외선 정보를 불러오는 중입니다.</small
            >
          </div>
        </article>

      </section>

      <section class="weather-map-card" aria-label="날씨 지도">
        <div class="weather-map-heading">
          <h2>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>
            날씨 지도
          </h2>
        </div>
        <div id="weatherLeafletMap" class="weather-leaflet-map" aria-label="대한민국 실시간 날씨 지도"></div>
        <div class="weather-map-tooltip" id="weatherMapTooltip" role="status" hidden></div>
      </section>
    </main>

    <aside class="weather-stadium-panel" aria-label="전국 구장 날씨">
      <div class="weather-panel-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" />
          <path d="m16 16 4.5 4.5" />
        </svg>
        <input
          id="stadiumSearch"
          type="search"
          placeholder="도시를 검색해보세요"
          aria-label="도시 또는 야구장 검색"
        />
        <span class="weather-panel-current-city">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
          <strong id="panelCity">서울</strong>
          <span aria-hidden="true">⌄</span>
        </span>
      </div>
      <h2>전국 주요 날씨</h2>
      <div class="weather-panel-list"></div>
      <p class="weather-panel-empty" hidden>검색 결과가 없습니다.</p>
    </aside>

    <script src="weather-list-shuffle.js"></script>
    <script src="weather-scene.js"></script>
    <script src="weather-service.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const { icons, stadiums, getCityName, loadForecast, initStadiumPanel } =
        window.weatherService;
      const stadiumName = localStorage.getItem("selectedStadium") || "잠실야구장";
      const place = stadiums[stadiumName] || stadiums["잠실야구장"];
      const uvDescriptions = [
        { max: 2, label: "낮음" },
        { max: 5, label: "보통" },
        { max: 7, label: "높음" },
        { max: 10, label: "매우 높음" },
        { max: Infinity, label: "위험" },
      ];
      const getElement = (id) => document.getElementById(id);

      // 날씨 지도: 8개 구장이 한눈에 보이도록 고정된 지도 (드래그·확대 없음)
      const mapRegions = Object.entries(stadiums).map(([stadium, { city, lat, lon }]) => ({
        stadium,
        city,
        lat,
        lon,
      }));
      // 수도권·경남처럼 가까운 구장의 이름표가 겹치지 않도록 방향을 정합니다.
      const mapLabelDirections = {
        인천: "left",
        서울: "right",
        수원: "bottom",
        광주: "left",
        창원: "bottom",
      };
      const mapWeatherCache = new Map();
      const mapTooltip = getElement("weatherMapTooltip");
      const mapCard = document.querySelector(".weather-map-card");
      const mapElement = getElement("weatherLeafletMap");
      // 구장이 모두 들어가는 본토 전체 범위 (울릉도 등 먼 섬 제외)
      const mainlandBounds = L.latLngBounds([[34.3, 125.95], [38.62, 129.6]]);
      const leafletMap = L.map(mapElement, {
        zoomControl: false,
        dragging: false,
        touchZoom: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        zoomSnap: 0,
        attributionControl: false,
      });
      // 구장 선택 화면과 같은 한국 지도 실루엣을 지도 배경으로 씁니다.
      // 범위는 SVG 속 시·도 경계와 실제 위경도를 맞춰 구한 값입니다.
      L.imageOverlay("assets/korea-map.svg?v=20260911", [[33.207, 125.339], [38.641, 130.946]], {
        className: "weather-map-silhouette",
      }).addTo(leafletMap);
      const fitStadiums = () => {
        leafletMap.invalidateSize({ animate: false, pan: false });
        leafletMap.fitBounds(mainlandBounds, { padding: [12, 12], animate: false });
      };
      fitStadiums();
      new ResizeObserver(() => requestAnimationFrame(fitStadiums)).observe(mapElement);

      function renderMapTooltip(region, data, marker) {
        const current = data?.list?.[0];
        const probability = Number.isFinite(current?.pop)
          ? `${Math.round(current.pop * 100)}%`
          : "정보 없음";
        const rainfall = Number.isFinite(current?.rain?.["3h"])
          ? `${current.rain["3h"]}mm`
          : "정보 없음";
        const temperature = Number.isFinite(current?.main?.temp)
          ? `${Math.round(current.main.temp)}°`
          : "정보 없음";
        const status = current?.weather?.[0]?.description || "정보 없음";
        mapTooltip.innerHTML = `<strong>${region.city}</strong><span>우천취소 위험 ${probability}</span><span>강수량 ${rainfall}</span><span>기온 ${temperature} · ${status}</span>`;
        mapTooltip.hidden = false;
        // 마커 옆, 구장 이름표의 반대쪽에 고정해서 표시하고 카드 밖으로 나가지 않게 맞춥니다.
        const point = leafletMap.latLngToContainerPoint(marker.getLatLng());
        const x = mapElement.offsetLeft + point.x;
        const y = mapElement.offsetTop + point.y;
        const fitsRight = x + 16 + mapTooltip.offsetWidth <= mapCard.clientWidth - 12;
        const fitsLeft = x - 16 - mapTooltip.offsetWidth >= 12;
        const labelOnRight = (mapLabelDirections[region.city] || "right") === "right";
        const right = labelOnRight ? !fitsLeft : fitsRight;
        mapTooltip.style.left = `${right ? x + 16 : x - 16 - mapTooltip.offsetWidth}px`;
        mapTooltip.style.top = `${Math.min(Math.max(12, y - mapTooltip.offsetHeight / 2), mapCard.clientHeight - mapTooltip.offsetHeight - 12)}px`;
      }

      let mapRequestId = 0;
      mapRegions.forEach((region) => {
        const isSelected = region.stadium === stadiumName;
        const marker = L.circleMarker([region.lat, region.lon], {
          radius: isSelected ? 8 : 6,
          color: "#ffffff",
          weight: 2,
          fillColor: isSelected ? "#ffd37e" : "#9fd0f2",
          fillOpacity: 1,
          className: "stadium-map-marker",
        }).addTo(leafletMap);
        marker.bindTooltip(region.city, {
          permanent: true,
          direction: mapLabelDirections[region.city] || "right",
          offset: [0, 0],
          className: `stadium-map-label${isSelected ? " is-selected" : ""}`,
        });
        marker.on("mouseover", async () => {
          const requestId = ++mapRequestId;
          try {
            let data = mapWeatherCache.get(region.stadium);
            if (!data) {
              data = await loadForecast(region.stadium);
              mapWeatherCache.set(region.stadium, data);
            }
            if (requestId === mapRequestId) renderMapTooltip(region, data, marker);
          } catch {
            if (requestId === mapRequestId) renderMapTooltip(region, {}, marker);
          }
        });
        marker.on("mouseout", () => {
          mapRequestId += 1;
          mapTooltip.hidden = true;
        });
        marker.on("click", () => {
          localStorage.setItem("selectedStadium", region.stadium);
          window.location.reload();
        });
      });

      const cityName = getCityName(stadiumName);
      getElement("heroCity").textContent = cityName;
      getElement("hourlyTitle").textContent = `${cityName} 시간별 날씨`;

      initStadiumPanel((selected) => {
        localStorage.setItem("selectedStadium", selected);
        window.location.reload();
      });

      function renderRainProbability(probability) {
        const card = document.querySelector(".rain-probability-card");
        const meter = document.querySelector(".rain-probability-meter");
        if (!Number.isFinite(probability)) {
          getElement("rainProbabilityValue").textContent = "확인 불가";
          getElement("rainProbabilityMessage").textContent =
            "우천취소 확률을 확인할 수 없습니다.";
          meter.setAttribute("aria-valuenow", "0");
          getElement("rainProbabilityMeter").style.width = "0%";
          card.removeAttribute("data-level");
          return;
        }
        const value = Math.max(0, Math.min(100, probability));
        const level = value >= 60 ? "high" : value >= 30 ? "medium" : "low";
        const messages = {
          high: "비가 올 가능성이 높아요.",
          medium: "비가 올 수 있어요. 우산을 준비하세요.",
          low: "비가 올 가능성이 낮아요.",
        };

        getElement("rainProbabilityValue").textContent = `${value}%`;
        getElement("rainProbabilityMessage").textContent = messages[level];
        meter.setAttribute("aria-valuenow", String(value));
        getElement("rainProbabilityMeter").style.width = `${value}%`;
        card.dataset.level = level;
      }

      function renderHeroRainProbability(probability) {
        const heroRainValue = getElement("heroRainProbabilityValue");
        heroRainValue.textContent = probability === null ? "확인 불가" : `${probability}%`;
        heroRainValue.classList.toggle("unavailable", probability === null);
      }

      function getForecastIcon(item) {
        const weatherMain = item?.weather?.[0]?.main;
        const rainProbability = Number(item?.pop);
        const rainAmount = Number(item?.rain?.["3h"] || item?.rain?.["1h"]);
        const hasRainForecast = Number.isFinite(rainAmount) && rainAmount > 0;
        const likelyRain = Number.isFinite(rainProbability) && rainProbability >= 0.4;

        if (
          hasRainForecast ||
          likelyRain ||
          ["Rain", "Drizzle", "Thunderstorm"].includes(weatherMain)
        ) {
          return weatherMain === "Thunderstorm" ? "⛈️" : "🌧️";
        }

        return icons[weatherMain] || "☁️";
      }

      const hourFormatter = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        hour: "2-digit",
        hourCycle: "h23",
      });

      function renderHourlyForecast(items) {
        const now = Math.floor(Date.now() / 1000);
        // OpenWeather의 dt는 UTC 기준 Unix timestamp이므로 숫자 자체를 KST로 다시 보정하지 않습니다.
        // 현재 시각 이후의 예보만 dt 순서로 정렬해 표시합니다.
        const upcomingItems = items
          .filter((item) => Number.isFinite(item?.dt) && item.dt >= now)
          .sort((a, b) => a.dt - b.dt)
          .slice(0, 12);

        if (!upcomingItems.length) {
          showForecastMessage("현재 이후 시간별 예보가 없습니다.");
          return;
        }

        const hours = upcomingItems.map((item) => {
          const hour = document.createElement("div");
          hour.className = "hour-item";

          const time = document.createElement("span");
          time.className = "time";
          const hourText = hourFormatter
            .formatToParts(new Date(item.dt * 1000))
            .find((part) => part.type === "hour").value;
          time.textContent = `${hourText}시`;

          const icon = document.createElement("span");
          icon.className = "icon";
          icon.textContent = getForecastIcon(item);
          icon.setAttribute("aria-hidden", "true");

          const temperature = document.createElement("strong");
          temperature.textContent = `${Math.round(item.main.temp)}°`;

          const rain = document.createElement("span");
          rain.className = "rain";
          rain.textContent = `강수 ${Math.round((item.pop || 0) * 100)}%`;

          hour.append(time, icon, temperature, rain);
          return hour;
        });

        document.querySelector(".hourly-weather").replaceChildren(...hours);
      }

      function showForecastMessage(message) {
        const messageElement = document.createElement("p");
        messageElement.className = "forecast-message";
        messageElement.textContent = message;
        document.querySelector(".hourly-weather").replaceChildren(messageElement);
      }

      function renderWeather(data) {
        const current = data.list?.[0];
        if (!current) throw new Error("날씨 예보 데이터가 비어 있습니다.");

        getElement("heroDate").textContent = new Intl.DateTimeFormat("ko-KR", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "long",
          day: "numeric",
        }).format(new Date(current.dt * 1000));

        const heroWeatherIcon = getElement("heroWeatherIcon");
        heroWeatherIcon.textContent = icons[current.weather[0].main] || "☁️";
        heroWeatherIcon.setAttribute("aria-label", current.weather[0].description || "날씨");
        getElement("temperature").textContent = `${Math.round(current.main.temp)}°`;
        getElement("weatherDescription").textContent = current.weather[0].description;
        getElement("feelsLike").textContent = `${Math.round(current.main.feels_like)}°`;
        getElement("humidityCard").textContent = `${current.main.humidity}%`;
        getElement("windCard").textContent =
          `${Math.round((current.wind?.speed || 0) * 10) / 10} m/s`;

        const rainProbability = Number.isFinite(current.pop)
          ? Math.round(current.pop * 100)
          : null;
        renderRainProbability(rainProbability);
        renderHeroRainProbability(rainProbability);
        renderHourlyForecast(data.list);
      }

      async function loadUvIndex() {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.search = new URLSearchParams({
          latitude: String(place.lat),
          longitude: String(place.lon),
          current: "uv_index",
          timezone: "Asia/Seoul",
          forecast_days: "1",
        }).toString();

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const uvIndex = data.current?.uv_index;
          if (typeof uvIndex !== "number" || !Number.isFinite(uvIndex)) {
            throw new Error("자외선 지수 데이터가 없습니다.");
          }

          getElement("uvIndexValue").textContent = String(Math.round(uvIndex));
          getElement("uvIndexMessage").textContent = uvDescriptions.find(
            ({ max }) => uvIndex <= max,
          ).label;
          document.querySelector(".uv-index-card").dataset.level =
            uvIndex <= 2 ? "low" : uvIndex <= 5 ? "medium" : "high";
        } catch (error) {
          console.error("자외선 지수를 불러오지 못했습니다.", error);
          getElement("uvIndexMessage").textContent =
            "자외선 정보를 불러오지 못했습니다.";
        }
      }

      async function loadWeather() {
        try {
          renderWeather(await loadForecast(stadiumName));
        } catch (error) {
          console.error("날씨 정보를 불러오지 못했습니다.", error);
          getElement("weatherDescription").textContent =
            "날씨 정보를 불러오지 못했습니다.";
          getElement("rainProbabilityMessage").textContent =
            "우천취소 확률을 불러오지 못했습니다.";
          renderHeroRainProbability(null);
          showForecastMessage("시간별 날씨 정보를 불러오지 못했습니다.");
        }
      }

      loadWeather();
      loadUvIndex();
    </script>
  </body>
</html>
