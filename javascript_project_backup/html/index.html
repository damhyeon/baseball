<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우천 취소 지킴이</title>
    <link rel="stylesheet" href="style.css?v=20261023-5" />
  </head>

  <body class="index-body">
    <aside class="app-sidebar">
      <a class="brand" href="index.html"
        ><i class="brand-mark"></i><span>우천 취소 지킴이</span></a
      >
      <nav>
        <a class="nav-home" href="index.html"
          ><i class="nav-icon stadium-icon"></i><span>구장 선택</span></a
        ><a class="nav-weather" href="weather.html"
          ><i class="nav-icon weather-icon-small"></i><span>날씨</span></a
        ><a class="nav-history" href="history.html"
          ><i class="nav-icon history-icon"></i><span>날씨 기록</span></a
        >
      </nav>
      <p class="sidebar-note">야구장 날씨를<br />한눈에 확인하세요.</p>
    </aside>
    <main class="main-page">
      <section class="map-section">
        <div class="korea-map">
          <img
            src="assets/korea-map.svg?v=20260911"
            class="korea-svg-img"
            alt="대한민국 지도"
          />

          <button
            class="stadium-marker marker-incheon"
            data-stadium="인천 SSG랜더스필드"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">인천</span
              ><small>SSG 랜더스필드</small></span
            >
          </button>
          <button
            class="stadium-marker marker-jamsil"
            data-stadium="잠실야구장"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">잠실</span
              ><small>잠실야구장</small></span
            >
          </button>
          <button
            class="stadium-marker marker-suwon"
            data-stadium="수원KT위즈파크"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">수원</span
              ><small>KT 위즈파크</small></span
            >
          </button>
          <button
            class="stadium-marker marker-daejeon"
            data-stadium="대전 한화생명 볼파크"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">대전</span
              ><small>한화생명 볼파크</small></span
            >
          </button>
          <button
            class="stadium-marker marker-daegu"
            data-stadium="대구 삼성 라이온즈 파크"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">대구</span
              ><small>삼성 라이온즈 파크</small></span
            >
          </button>
          <button
            class="stadium-marker marker-gwangju"
            data-stadium="광주기아챔피언스필드"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">광주</span
              ><small>광주-기아 챔피언스 필드</small></span
            >
          </button>
          <button
            class="stadium-marker marker-changwon"
            data-stadium="창원NC파크"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">창원</span><small>NC파크</small></span
            >
          </button>
          <button
            class="stadium-marker marker-busan"
            data-stadium="사직야구장"
          >
            <span class="marker" aria-hidden="true"></span
            ><span class="stadium-marker-info"
              ><span class="stadium-name">부산</span
              ><small>사직야구장</small></span
            >
          </button>
        </div>
      </section>

      <aside class="index-weather-panel weather-stadium-panel" aria-label="전국 구장 날씨">
        <div class="weather-panel-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" />
            <path d="m16 16 4.5 4.5" />
          </svg>
          <input
            id="stadiumSearch"
            type="search"
            placeholder="도시를 검색해보세요"
            aria-label="도시 또는 야구장 검색"
          />
          <span class="weather-panel-current-city">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>
            <strong id="panelCity">서울</strong>
            <span aria-hidden="true">⌄</span>
          </span>
        </div>
        <h2>전국 주요 날씨</h2>
        <div class="weather-panel-list"></div>
        <p class="weather-panel-empty" hidden>검색 결과가 없습니다.</p>
      </aside>

    </main>

    <script src="weather-list-shuffle.js"></script>
    <script src="weather-service.js"></script>
    <script>
      const stadiumCoordinates = {
        "인천 SSG랜더스필드": { x: 105, y: 120 },
        잠실야구장: { x: 235, y: 125 },
        수원KT위즈파크: { x: 175, y: 175 },
        "대전 한화생명 볼파크": { x: 220, y: 260 },
        "대구 삼성 라이온즈 파크": { x: 295, y: 345 },
        광주기아챔피언스필드: { x: 150, y: 380 },
        창원NC파크: { x: 205, y: 395 },
        사직야구장: { x: 355, y: 400 },
      };
      const mapCanvas = document.querySelector(".korea-map");
      const mapImage = document.querySelector(".korea-svg-img");
      const stadiumMarkers = document.querySelectorAll(".stadium-marker");

      function selectStadium(stadiumName) {
        localStorage.setItem("selectedStadium", stadiumName);
        window.location.href = "weather.html";
      }

      function positionMarkers() {
        const width = mapCanvas.clientWidth;
        const height = mapCanvas.clientHeight;
        const scale = Math.min(width / 524, height / 631);
        const offsetX = (width - 524 * scale) / 2;
        const offsetY = (height - 631 * scale) / 2;
        stadiumMarkers.forEach((marker) => {
          const point = stadiumCoordinates[marker.dataset.stadium];
          marker.style.setProperty("left", `${offsetX + point.x * scale}px`, "important");
          marker.style.setProperty("top", `${offsetY + point.y * scale}px`, "important");
        });
      }

      window.weatherService.initStadiumPanel(selectStadium, "quick-weather");
      stadiumMarkers.forEach((marker) =>
        marker.addEventListener("click", () => selectStadium(marker.dataset.stadium)),
      );
      window.addEventListener("resize", positionMarkers);
      if (mapImage.complete) positionMarkers();
      else mapImage.addEventListener("load", positionMarkers);
    </script>
  </body>
</html>
