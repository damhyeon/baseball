            data-stadium="광주기아챔피언스필드"

      <aside class="index-weather-panel weather-stadium-panel" aria-label="전국 구장 날씨">
        <div class="weather-panel-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" />
            <path d="m16 16 4.5 4.5" />
          </svg>
          <input
            id="stadiumSearch"
            type="search"
            placeholder="도시를 검색해보세요"
            aria-label="도시 또는 야구장 검색"
          />
          <span class="weather-panel-current-city">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>
            <strong id="panelCity">서울</strong>
            <span aria-hidden="true">⌄</span>
          </span>
        </div>
        <h2>전국 주요 날씨</h2>
        <div class="weather-panel-list">
          <button class="quick-weather" type="button" data-stadium="인천 SSG랜더스필드">
            <span class="stadium-weather-icon" aria-hidden="true">☁️</span>
            <span class="stadium-weather-name">인천 SSG랜더스필드<small>흐림</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button class="quick-weather" type="button" data-stadium="잠실야구장">
            <span class="stadium-weather-icon" aria-hidden="true">🌧️</span>
            <span class="stadium-weather-name">잠실야구장<small>비</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button class="quick-weather" type="button" data-stadium="수원KT위즈파크">
            <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
            <span class="stadium-weather-name">수원 KT 위즈파크<small>구름 조금</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button class="quick-weather" type="button" data-stadium="대전 한화생명 볼파크">
            <span class="stadium-weather-icon" aria-hidden="true">🌧️</span>
            <span class="stadium-weather-name">대전 한화생명 볼파크<small>비</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button class="quick-weather" type="button" data-stadium="대구 삼성 라이온즈 파크">
            <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
            <span class="stadium-weather-name">대구 삼성 라이온즈 파크<small>구름 조금</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button class="quick-weather" type="button" data-stadium="광주기아챔피언스필드">
            <span class="stadium-weather-icon" aria-hidden="true">☀️</span>
            <span class="stadium-weather-name">광주-기아 챔피언스 필드<small>맑음</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button class="quick-weather" type="button" data-stadium="창원NC파크">
            <span class="stadium-weather-icon" aria-hidden="true">☁️</span>
            <span class="stadium-weather-name">창원 NC파크<small>흐림</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button class="quick-weather" type="button" data-stadium="사직야구장">
            <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
            <span class="stadium-weather-name">부산 사직야구장<small>구름 조금</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
        </div>
        <p class="weather-panel-empty" hidden>검색 결과가 없습니다.</p>
      </aside>

    </main>

    <script src="weather-list-shuffle.js"></script>
    <script src="weather-service.js"></script>
    <script>
      const stadiumCoordinates = {
        "인천 SSG랜더스필드": { x: 105, y: 120 },
        잠실야구장: { x: 235, y: 125 },
        수원KT위즈파크: { x: 175, y: 175 },
        "대전 한화생명 볼파크": { x: 220, y: 260 },
        "대구 삼성 라이온즈 파크": {
          x: 295,
          y: 345,
        },
        광주기아챔피언스필드: { x: 150, y: 380 },
        창원NC파크: { x: 205, y: 395 },
        사직야구장: { x: 355, y: 400 },
      };
      const mapCanvas = document.querySelector(".korea-map");
      const mapImage = document.querySelector(".korea-svg-img");
      const stadiumMarkers = document.querySelectorAll(".stadium-marker");
      const cityNames = {
        "인천 SSG랜더스필드": "인천",
        잠실야구장: "서울",
        수원KT위즈파크: "수원",
        "대전 한화생명 볼파크": "대전",
        "대구 삼성 라이온즈 파크": "대구",
        광주기아챔피언스필드: "광주",
        창원NC파크: "창원",
        사직야구장: "부산",
      };
      const selectedStadium = localStorage.getItem("selectedStadium");
      document.getElementById("panelCity").textContent =
        cityNames[selectedStadium] || "서울";
      window.weatherService.loadPanelWeather();

      const stadiumSearch = document.getElementById("stadiumSearch");
      const weatherButtons = [
        ...document.querySelectorAll(".weather-panel-list button"),
      ];
      stadiumSearch.addEventListener("input", () => {
        const query = stadiumSearch.value.trim().toLocaleLowerCase("ko");
        let visibleCount = 0;

        weatherButtons.forEach((button) => {
          const isMatch = button.textContent.toLocaleLowerCase("ko").includes(query);
          button.hidden = !isMatch;
          if (isMatch) visibleCount += 1;
        });
        document.querySelector(".weather-panel-empty").hidden =
          visibleCount > 0;
      });

      function positionMarkers() {
        const width = mapCanvas.clientWidth;
        const height = mapCanvas.clientHeight;
        const scale = Math.min(width / 524, height / 631);
        const offsetX = (width - 524 * scale) / 2;
        const offsetY = (height - 631 * scale) / 2;
        stadiumMarkers.forEach((marker) => {
          const point = stadiumCoordinates[marker.dataset.stadium];
          if (!point || !marker.classList.contains("stadium-marker")) return;
          marker.style.setProperty(
            "left",
            `${offsetX + point.x * scale}px`,
            "important",
          );
          marker.style.setProperty(
            "top",
            `${offsetY + point.y * scale}px`,
            "important",
          );
        });
      }
      function selectStadium(event) {
        const stadiumName = event.currentTarget.dataset.stadium;
        localStorage.setItem("selectedStadium", stadiumName);
        window.location.href = "weather.html";
      }
      [...stadiumMarkers, ...weatherButtons].forEach((button) =>
        button.addEventListener("click", selectStadium),
      );
      window.addEventListener("resize", positionMarkers);
      if (mapImage.complete) positionMarkers();
      else mapImage.addEventListener("load", positionMarkers);
    </script>
  </body>
</html>
