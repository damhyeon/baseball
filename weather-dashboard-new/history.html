<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>과거 날씨 기록 - 우천 취소 지킴이</title>

    <link rel="stylesheet" href="style.css?v=20261023-10" />
    <link rel="stylesheet" href="history.css?v=20261023-5" />
  </head>

  <body class="history-body">
    <aside class="app-sidebar">
      <a class="brand" href="index.html"
        ><i class="brand-mark"></i><span>우천 취소 지킴이</span></a
      >
      <nav>
        <a class="nav-home" href="index.html"
          ><i class="nav-icon stadium-icon"></i><span>구장 선택</span></a
        ><a class="nav-weather" href="weather.html"
          ><i class="nav-icon weather-icon-small"></i><span>날씨</span></a
        ><a class="nav-history" href="history.html"
          ><i class="nav-icon history-icon"></i><span>날씨 기록</span></a
        >
      </nav>
      <p class="sidebar-note">야구장 날씨를<br />한눈에 확인하세요.</p>
    </aside>

    <main class="history-page">
      <header class="history-header">
        <button class="back-button" type="button" aria-label="이전 페이지">←</button>
          <p id="stadiumName">야구장</p>
        </div>
      </header>

      <section class="history-intro">
        <p>선택한 구장의 향후 5일 우천취소 위험을 확인하세요.</p>
      </section>

      <section class="date-select-section">
        <h3>날짜 선택</h3>
        <div class="date-buttons" id="dateButtons"></div>
      </section>

      <section class="five-day-forecast" aria-labelledby="fiveDayTitle">
        <div class="section-title">
          <h3 id="fiveDayTitle">향후 5일 우천취소 확률</h3>
        </div>
        <div class="five-day-forecast-list" id="fiveDayForecastList" aria-live="polite"></div>
      </section>

      <section class="history-weather" title="전년도 과거 날씨 기록입니다.">
        <span class="history-tooltip" role="tooltip">전년도 과거 날씨 기록입니다.</span>
        <div class="section-title">
          <h3>과거 날씨</h3>
          <span id="historyDate" class="date-text">날짜를 선택하세요.</span>
        </div>

        <div class="weather-summary">
          <div class="weather-icon" id="historyIcon">--</div>

          <div class="temperature">
            <strong id="historyTemperature">--</strong>
            <span id="historyDescription">날씨 정보를 불러오는 중입니다.</span>
          </div>

          <div class="weather-info">
            <div>
              <span>습도</span>
              <strong id="historyHumidity">--</strong>
            </div>

            <div>
              <span>강수량</span>
              <strong id="historyRainfall">--</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="before-weather">
        <div class="section-title">
          <div>
            <h3>경기 전 날씨</h3>
            <p>경기일까지 날씨 변화를 확인하세요.</p>
          </div>
        </div>

        <div class="weather-timeline">
          <div class="timeline-item">
            <span class="day">D-3</span>
            <strong>8/25</strong>
            <span class="icon">🌧️</span>
            <span>비</span>
          </div>

          <div class="timeline-item">
            <span class="day">D-2</span>
            <strong>8/26</strong>
            <span class="icon">☁️</span>
            <span>흐림</span>
          </div>

          <div class="timeline-item">
            <span class="day">D-1</span>
            <strong>8/27</strong>
            <span class="icon">🌤️</span>
            <span>구름 조금</span>
          </div>

          <div class="timeline-item today">
            <span class="day">경기일</span>
            <strong>8/28</strong>
            <span class="icon">☁️</span>
            <span>흐림</span>
          </div>
        </div>
      </section>

      <aside class="weather-stadium-panel" aria-label="전국 구장 날씨">
        <div class="weather-panel-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" />
            <path d="m16 16 4.5 4.5" />
          </svg>
          <input
            id="stadiumSearch"
            type="search"
            placeholder="도시를 검색해보세요"
            aria-label="도시 또는 야구장 검색"
          />
          <span class="weather-panel-current-city">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>
            <strong id="panelCity">서울</strong>
            <span aria-hidden="true">⌄</span>
          </span>
        </div>
        <h2>전국 주요 날씨</h2>
        <div class="weather-panel-list">
          <button type="button" data-stadium="인천 SSG랜더스필드">
            <span class="stadium-weather-icon" aria-hidden="true">☁️</span>
            <span class="stadium-weather-name">인천 SSG랜더스필드<small>흐림</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button type="button" data-stadium="잠실야구장">
            <span class="stadium-weather-icon" aria-hidden="true">🌧️</span>
            <span class="stadium-weather-name">잠실야구장<small>비</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button type="button" data-stadium="수원KT위즈파크">
            <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
            <span class="stadium-weather-name">수원 KT 위즈파크<small>구름 조금</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button type="button" data-stadium="대전 한화생명 볼파크">
            <span class="stadium-weather-icon" aria-hidden="true">🌧️</span>
            <span class="stadium-weather-name">대전 한화생명 볼파크<small>비</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button type="button" data-stadium="대구 삼성 라이온즈 파크">
            <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
            <span class="stadium-weather-name">대구 삼성 라이온즈 파크<small>구름 조금</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button type="button" data-stadium="광주기아챔피언스필드">
            <span class="stadium-weather-icon" aria-hidden="true">☀️</span>
            <span class="stadium-weather-name">광주-기아 챔피언스 필드<small>맑음</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button type="button" data-stadium="창원NC파크">
            <span class="stadium-weather-icon" aria-hidden="true">☁️</span>
            <span class="stadium-weather-name">창원 NC파크<small>흐림</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
          <button type="button" data-stadium="사직야구장">
            <span class="stadium-weather-icon" aria-hidden="true">🌤️</span>
            <span class="stadium-weather-name">부산 사직야구장<small>구름 조금</small></span>
            <b>21°</b><i aria-hidden="true">›</i>
          </button>
        </div>
        <p class="weather-panel-empty" hidden>검색 결과가 없습니다.</p>
      </aside>
    </main>

    <script src="weather-list-shuffle.js"></script>
    <script src="weather-service.js"></script>
    <script>
      const stadiumName = localStorage.getItem("selectedStadium");
      if (stadiumName) {
        document.getElementById("stadiumName").textContent = stadiumName;
      }

      const cityNames = {
        "인천 SSG랜더스필드": "인천",
        잠실야구장: "서울",
        수원KT위즈파크: "수원",
        "대전 한화생명 볼파크": "대전",
        "대구 삼성 라이온즈 파크": "대구",
        광주기아챔피언스필드: "광주",
        창원NC파크: "창원",
        사직야구장: "부산",
      };
      document.getElementById("panelCity").textContent =
        cityNames[stadiumName] || "서울";
      window.weatherService.loadPanelWeather();

      const stadiumSearch = document.getElementById("stadiumSearch");
      const stadiumButtons = [
        ...document.querySelectorAll(".weather-panel-list button"),
      ];
      stadiumSearch.addEventListener("input", () => {
        const query = stadiumSearch.value.trim().toLocaleLowerCase("ko");
        let visibleCount = 0;

        stadiumButtons.forEach((button) => {
          const isMatch = button.textContent
            .toLocaleLowerCase("ko")
            .includes(query);
          button.hidden = !isMatch;
          if (isMatch) visibleCount += 1;
        });
        document.querySelector(".weather-panel-empty").hidden =
          visibleCount > 0;
      });

      stadiumButtons.forEach((button) => {
        button.addEventListener("click", () => {
          localStorage.setItem("selectedStadium", button.dataset.stadium);
          window.location.reload();
        });
      });

      document.querySelector(".back-button").addEventListener("click", () => {
        window.history.back();
      });

      const fiveDayList = document.getElementById("fiveDayForecastList");
      const fiveDayFormatter = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "long",
        day: "numeric",
        weekday: "short",
      });
      const getSeoulDateKey = (timestamp) =>
        new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(new Date(timestamp * 1000));
      const getDateKey = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      };
      const renderFiveDayError = () => {
        fiveDayList.replaceChildren(Object.assign(document.createElement("p"), {
          className: "five-day-forecast-message",
          textContent: "강수확률을 확인할 수 없습니다.",
        }));
      };
      const loadFiveDayForecast = async () => {
        try {
          const data = await window.weatherService.loadForecast(stadiumName || "잠실야구장");
          const today = new Date();
          const dates = Array.from({ length: 5 }, (_, index) => {
            const date = new Date(today);
            date.setDate(today.getDate() + index);
            return date;
          });
          const daily = new Map(dates.map((date) => [getDateKey(date), []]));
          (data.list || []).forEach((item) => {
            const key = getSeoulDateKey(item.dt);
            if (daily.has(key) && Number.isFinite(item.pop)) daily.get(key).push(item.pop);
          });
          fiveDayList.replaceChildren(...dates.map((date) => {
            const item = document.createElement("div");
            item.className = "five-day-forecast-item";
            const dateElement = document.createElement("span");
            dateElement.className = "date-text";
            dateElement.textContent = fiveDayFormatter.format(date);
            const value = document.createElement("strong");
            const probabilities = daily.get(getDateKey(date));
            // API가 제공하는 실제 강수확률(POP)을 해당 날짜의 우천취소 위험 기준으로 사용합니다.
            // 하루 대표값은 3시간 예보 중 가장 높은 강수확률입니다.
            value.textContent = probabilities?.length
              ? `${Math.round(Math.max(...probabilities) * 100)}%`
              : "확인 불가";
            const label = document.createElement("small");
            label.textContent = "우천취소 확률";
            item.append(dateElement, value, label);
            return item;
          }));
        } catch (error) {
          console.error("향후 5일 강수확률 조회 실패:", error);
          renderFiveDayError();
        }
      };
      loadFiveDayForecast();

      const dateButtonsContainer = document.getElementById("dateButtons");
      const dateFormatter = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric" });
      const monthDayFormatter = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric" });
      const today = new Date();
      const selectedDates = Array.from({ length: 5 }, (_, index) => {
        const date = new Date(today);
        date.setFullYear(date.getFullYear() - 1);
        date.setDate(date.getDate() - index);
        return date;
      });
      const toDateParam = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      };
      const showHistoryError = (message) => {
        document.getElementById("historyDescription").textContent = message;
        ["historyTemperature", "historyHumidity", "historyRainfall"].forEach((id) => { document.getElementById(id).textContent = "--"; });
        document.getElementById("historyIcon").textContent = "⚠️";
      };
      async function loadHistory(date) {
        document.getElementById("historyDate").textContent = dateFormatter.format(date);
        document.getElementById("historyDescription").textContent = "과거 관측 데이터를 불러오는 중입니다.";
        try {
          const response = await fetch(`/api/history?stadium=${encodeURIComponent(stadiumName || "잠실야구장")}&date=${toDateParam(date)}`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "과거 날씨 데이터를 불러오지 못했습니다.");
          const daily = data.daily;
          const code = daily.weather_code[0];
          const descriptions = { 0: ["☀️", "맑음"], 1: ["🌤️", "대체로 맑음"], 2: ["⛅", "부분적으로 흐림"], 3: ["☁️", "흐림"], 45: ["🌫️", "안개"], 51: ["🌦️", "이슬비"], 61: ["🌧️", "비"], 71: ["❄️", "눈"], 80: ["🌧️", "소나기"], 95: ["⛈️", "뇌우"] };
          const [icon, description] = descriptions[code] || ["🌡️", "관측 코드 확인 필요"];
          document.getElementById("historyIcon").textContent = icon;
          document.getElementById("historyDescription").textContent = description;
          document.getElementById("historyTemperature").textContent = `${Math.round(daily.temperature_2m_mean[0])}℃`;
          document.getElementById("historyHumidity").textContent = `${Math.round(daily.relative_humidity_2m_mean[0])}%`;
          document.getElementById("historyRainfall").textContent = `${Number(daily.precipitation_sum[0]).toFixed(1)}mm`;
        } catch (error) { showHistoryError(error.message); }
      }
      selectedDates.forEach((date, index) => {
        const button = document.createElement("button");
        button.className = `date-button${index === 0 ? " active" : ""}`;
        button.type = "button"; button.textContent = monthDayFormatter.format(date); button.dataset.date = toDateParam(date);
        button.addEventListener("click", () => { document.querySelectorAll(".date-button").forEach((item) => item.classList.remove("active")); button.classList.add("active"); loadHistory(date); });
        dateButtonsContainer.append(button);
      });
      loadHistory(selectedDates[0]);
    </script>
  </body>
</html>
