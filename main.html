<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구장별 날씨 예보</title>
</head>
<body>
    <button onclick="result('잠실')">잠실</button>
    <button onclick="result('문학')">문학</button>
    <button onclick="result('수원')">수원</button>
    <button onclick="result('대전')">대전</button>
    <button onclick="result('대구')">대구</button>
    <button onclick="result('광주')">광주</button>
    <button onclick="result('사직')">사직</button>
    <button onclick="result('창원')">창원</button>
    <h2 id="result"></h2>

    <script type="module" src="js/main.js"></script>
    
    <script type="module">
        window.result = async function(name) {
            const res = await window.main(name);

            if (res) {
                const color = res[0]; // 인덱스 0: 배경색 문자열
                const risk = res[1];  // 인덱스 1: 취소 위험도 확률

                document.getElementById('result').innerText = `${name} 구장 취소 위험도: ${risk}%`;

                document.body.style.backgroundColor = color;
            }
        };
    </script>
</body>
</html>
